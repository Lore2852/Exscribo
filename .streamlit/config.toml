# Configurazione di Streamlit per Exscribo.

[server]
# Rende la pagina raggiungibile SOLO da questo computer.
# Senza questa riga, chiunque sulla stessa rete Wi-Fi potrebbe aprirla.
address = "localhost"
port = 8501
# Dimensione massima di un PDF caricato, in MB
maxUploadSize = 50

[browser]
# Non inviare statistiche d'uso anonime agli sviluppatori di Streamlit.
gatherUsageStats = false

[client]
# Nasconde il pulsante "Deploy" (pubblicherebbe l'app su internet)
# e le opzioni per sviluppatori nel menu.
toolbarMode = "minimal"

[theme]
# Colori dell'interfaccia: un verde petrolio calmo al posto del rosso predefinito,
# che a colpo d'occhio sembra un errore.
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#1E293B"
